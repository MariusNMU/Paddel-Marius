# ==========================================================
# Profil PostgreSQL
# Activé uniquement avec :
# .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=postgres
# ==========================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/padel_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:padel_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:padel_app_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Liquibase utilise le compte dédié aux migrations, tandis que le backend
# continue à utiliser padel_app pour les accès métier.
spring.liquibase.url=${SPRING_LIQUIBASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/padel_db}}
spring.liquibase.user=${SPRING_LIQUIBASE_USER:padel_migration}
spring.liquibase.password=${SPRING_LIQUIBASE_PASSWORD:padel_migration_password}

# Hibernate vérifie la cohérence entre les entités et le schéma créé par
# Liquibase, sans modifier lui-même la structure de la base.
spring.jpa.hibernate.ddl-auto=validate

# Utile en développement pour voir les requêtes SQL.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# On désactive la console H2 quand PostgreSQL est utilisé.
spring.h2.console.enabled=false

# Important :
# On évite d'exécuter automatiquement data.sql sur PostgreSQL,
# car le seed H2 peut contenir des syntaxes spécifiques à H2.
spring.sql.init.mode=never
