

# Configuration JWT locale de démonstration.
# La valeur par défaut est réservée au démarrage local.
# En déploiement réel, définir PADEL_JWT_SECRET avec un secret externe robuste.
padel.jwt.secret=${PADEL_JWT_SECRET:padel-marius-dev-secret-change-me-2026}
padel.jwt.expiration-minutes=60

# Le health check standard est fourni par Spring Boot Actuator.
# Aucun autre endpoint Actuator n'est exposé sur HTTP.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoints.web.discovery.enabled=false
