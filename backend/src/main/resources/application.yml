spring:
  application:
    name: padel-backend

  datasource:
    url: jdbc:h2:mem:padeldb
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    contexts:
      - demo

  sql:
    init:
      mode: never

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

padel:
  traitement-echeance:
    planification-active: ${PADEL_ECHEANCES_PLANIFICATION_ACTIVE:true}
    delai-initial-ms: ${PADEL_ECHEANCES_DELAI_INITIAL_MS:60000}
    intervalle-ms: ${PADEL_ECHEANCES_INTERVALLE_MS:60000}
  traitement-veille:
    planification-active: ${PADEL_VEILLE_PLANIFICATION_ACTIVE:true}
    delai-initial-ms: ${PADEL_VEILLE_DELAI_INITIAL_MS:30000}
    intervalle-ms: ${PADEL_VEILLE_INTERVALLE_MS:3600000}
  demo:
    enabled: ${PADEL_DEMO_ENABLED:true}
    mot-de-passe-joueur: password
    joueurs:
      - matricule: G1001
        description: joueur GLOBAL actif
      - matricule: G1002
        description: joueur GLOBAL avec dette ouverte et pénalité active cohérentes
      - matricule: S1001
        description: joueur SITE rattaché à Padel Bruxelles (1001)
      - matricule: S1002
        description: joueur SITE rattaché à Padel Namur (1002)
      - matricule: L1001
        description: joueur LIBRE actif
      - matricule: L1002
        description: joueur LIBRE actif
      - matricule: G9999
        description: joueur inactif pour tester le refus
    administrateurs:
      - login: admin-global
        mot-de-passe: secret
        description: administrateur GLOBAL
      - login: admin-bruxelles
        mot-de-passe: secret-site
        description: administrateur SITE Bruxelles (1001)
