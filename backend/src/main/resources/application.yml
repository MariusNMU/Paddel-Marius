spring:
  application:
    name: padel-backend

  datasource:
    url: jdbc:h2:mem:padeldb
    username: sa
    password:

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

padel:
  demo:
    enabled: ${PADEL_DEMO_ENABLED:true}
    mot-de-passe-joueur: password
    joueurs:
      - matricule: G1001
        description: joueur GLOBAL actif
      - matricule: G1002
        description: joueur GLOBAL actif avec dette ouverte
      - matricule: S1001
        description: joueur SITE rattaché à Padel Bruxelles (1001)
      - matricule: S1002
        description: joueur SITE rattaché à Padel Namur (1002)
      - matricule: L1001
        description: joueur LIBRE actif
      - matricule: L1002
        description: joueur LIBRE avec pénalité active
      - matricule: G9999
        description: joueur inactif pour tester le refus
    administrateurs:
      - login: admin-global
        mot-de-passe: secret
        description: administrateur GLOBAL
      - login: admin-bruxelles
        mot-de-passe: secret-site
        description: administrateur SITE Bruxelles (1001)
