# Configuration commune aux tests lancés depuis Maven ou IntelliJ.
padel.jwt.secret=padel-marius-test-secret-change-me-2026
padel.jwt.expiration-minutes=60

# Chaque contexte Spring de test reçoit sa propre base H2 en mémoire.
spring.datasource.url=jdbc:h2:mem:padeldb-test-${random.uuid}

# Les tests créent toujours le schéma avec Liquibase.
# Les données de démonstration restent chargées explicitement par les tests
# qui en ont besoin via @Sql("/data.sql").
spring.liquibase.contexts=test
spring.sql.init.mode=never
