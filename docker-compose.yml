services:
  postgres:
    image: postgres:16-alpine
    container_name: padel-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: padel_db
      POSTGRES_USER: padel_admin
      POSTGRES_PASSWORD: padel_admin_password

    ports:
      - "5432:5432"

    volumes:
      - padel_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padel_admin -d padel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  padel_postgres_data: